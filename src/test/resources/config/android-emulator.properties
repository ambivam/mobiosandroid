# Android Emulator Configuration for QA App
platform.name=Android
platform.version=16
device.name=Android
automation.name=UiAutomator2
app.package=com.stratis.estaffing
# app.activity=com.stratis.estaffing.MainActivity
app.path=src/test/resources/apps/app-V1.14.10-QA.apk

# Emulator Specific Settings
avd.name=Pixel_9a
device.udid=emulator-5554
no.reset=false
full.reset=false
auto.grant.permissions=true
auto.accept.alerts=true

# Additional Emulator Capabilities
platform.name.capability=Android
automation.name.capability=UiAutomator2
udid.capability=emulator-5554
device.name.capability=Android

# Performance Settings for Emulator
new.command.timeout=300
command.timeout=300
app.wait.timeout=30000
app.wait.activity=*

# Appium Server
appium.server.url=http://localhost:4723
implicit.wait=15
explicit.wait=30

# Screenshot settings
screenshot.on.failure=true
screenshot.path=test-output/screenshots/

# Emulator specific capabilities
system.port=8200
chrome.driver.port=9515
